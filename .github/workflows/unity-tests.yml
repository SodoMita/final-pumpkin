name: Unity tests

# Runs the EditMode and PlayMode suites with GameCI's Unity test runner.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   UNITY_LICENSE  - contents of the .ulf file for Unity Personal/Pro
#   UNITY_EMAIL    - the account that owns the license
#   UNITY_PASSWORD - that account's password
#
# How to get the .ulf: open the project in the Unity Editor once,
# Help -> Manage License -> Activate License Manually, then copy the file.
# Without these three secrets the runner fails at activation; nothing else in
# the repo depends on them.

# The test runner posts a check run with the results, which needs explicit
# permission on repositories with read-only default tokens.
permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: Also build a Linux player after the tests pass
        type: boolean
        default: true

env:
  UNITY_VERSION: 6000.3.26f1

jobs:
  test:
    name: Tests (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - name: Run ${{ matrix.testMode }} tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} results
          # -force-free keeps the editor on the free license instead of waiting on
          # an entitlement refresh, which is where the batch-mode runs stalled.
          customParameters: -nographics -force-free
          # Pin the game-ci CLI instead of resolving "latest" through the GitHub API,
          # which can return 403 when the runner's shared IP is rate limited.
          cliVersion: v0.1.72

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn

  build:
    name: Build Linux player
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneLinux64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneLinux64-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildName: FinalPumpkin
          # Add more targets to this matrix when needed, for example:
          #   targetPlatform: Android   (needs an Android module image)
          #   targetPlatform: WebGL
          allowDirtyBuild: true

      - name: Upload player
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-StandaloneLinux64
          path: build/StandaloneLinux64
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: Logs
          if-no-files-found: ignore
